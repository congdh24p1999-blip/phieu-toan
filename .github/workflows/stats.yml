name: Cập nhật thống kê
on:
  schedule:
    - cron: '23 * * * *'        # mỗi giờ (phút 23)
  workflow_dispatch: {}         # bấm chạy tay trong tab Actions
permissions:
  contents: write
concurrency: { group: stats, cancel-in-progress: true }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Kiểm tra khóa GoatCounter
        id: key
        env:
          GOATCOUNTER_KEY: ${{ secrets.GOATCOUNTER_KEY }}
        run: |
          if [ -z "$GOATCOUNTER_KEY" ]; then
            echo "::warning::Chưa có secret GOATCOUNTER_KEY (Settings → Secrets and variables → Actions). Bỏ qua lần chạy này."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Lấy số liệu GoatCounter
        if: steps.key.outputs.ok == '1'
        env:
          GOATCOUNTER_KEY: ${{ secrets.GOATCOUNTER_KEY }}
          GOATCOUNTER_SITE: xuongdetoan1
        run: node tools/fetch-stats.mjs out/stats.json
      - name: Ghi vào nhánh stats (một commit duy nhất, không làm rối lịch sử main)
        if: steps.key.outputs.ok == '1'
        run: |
          cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -q -m "Thống kê $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stats
